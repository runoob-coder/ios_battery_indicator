name: ios_battery_indicator
description: "A Flutter widget that replicates the native iOS battery indicator, including support for iOS 27 style and automatic system battery monitoring."
version: 2.0.0
homepage: https://runoob-coder.github.io/ios_battery_indicator/
repository: https://github.com/runoob-coder/ios_battery_indicator
issue_tracker: https://github.com/runoob-coder/ios_battery_indicator/issues
documentation: https://github.com/runoob-coder/ios_battery_indicator
topics:
  - battery-indicator
  - cupertino
  - widget
  - ui
  - components

screenshots:
  - description: "iOS Battery Indicator"
    path: screenshots/battery.png
  - description: "Battery States (with percentage)"
    path: screenshots/battery-states-with-percentage.png
  - description: "Battery States (no percentage)"
    path: screenshots/battery-states-no-percentage.png
  - description: "Battery States (no percentage, iOS 27 style)"
    path: screenshots/battery-states-ios-27.png

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_ui: any
  material_ui: any

  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  version: ^3.0.2
  cutout: ^1.0.2
  ios_system_sound: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # iOS 27 style only: the rounded SF Pro face used by the percentage text.
  # Everywhere else the text renders with Apple's system font via Flutter's
  # `CupertinoSystemText` proxy family, because embedding Apple-provided fonts
  # is rejected by App Store Connect (ITMS-91182, TN3214).
  fonts:
    - family: SF-Pro-Rounded-Medium
      fonts:
        - asset: ./fonts/SF-Pro-Rounded-Medium.otf
